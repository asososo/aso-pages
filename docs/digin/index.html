    // 1. 篩選出 sub_name 不為空的元素
    const filteredOutput = output.filter(item => item.sub_name.length > 0);

    // 2. 構建節點和邊資料
    const nodes = [];
    const edges = [];
    const nodeTypes = {}; // 用於標記每個節點的類型 (name, sub_name, or both)

    // 添加節點
    filteredOutput.forEach(item => {
      // 將 name 作為節點
      if (!nodeTypes[item.name]) nodeTypes[item.name] = "name";

      // 添加 sub_name 節點和邊
      item.sub_name.forEach(sub => {
        if (!nodeTypes[sub]) {
          nodeTypes[sub] = "sub_name";
        } else if (nodeTypes[sub] === "name") {
          nodeTypes[sub] = "both"; // 同時是 name 和 sub_name
        }

        // 添加邊
        edges.push({ data: { id: `${item.name}-${sub}`, source: item.name, target: sub } });
      });
    });

    // 將節點轉換為 Cytoscape 格式
    Object.keys(nodeTypes).forEach(nodeId => {
      nodes.push({
        data: { id: nodeId, label: nodeId, type: nodeTypes[nodeId] }
      });
    });

    // 3. 初始化 Cytoscape.js
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [
        ...nodes,
        ...edges
      ],
      style: [
        // 名稱節點樣式 (只屬於 name 的節點)
        {
          selector: 'node[type="name"]',
          style: {
            'background-color': '#0074D9', // 藍色
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-halign': 'center',
            'font-size': '12px',
          }
        },
        // 子名稱節點樣式 (只屬於 sub_name 的節點)
        {
          selector: 'node[type="sub_name"]',
          style: {
            'background-color': '#FF851B', // 橙色
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-halign': 'center',
            'font-size': '12px',
          }
        },
        // 同時是名稱與子名稱的節點樣式
        {
          selector: 'node[type="both"]',
          style: {
            'background-color': '#2ECC40', // 綠色
            'label': 'data(label)',
            'color': '#fff',
            'text-valign': 'center',
            'text-halign': 'center',
            'font-size': '12px',
            'border-width': 3,
            'border-color': '#001f3f' // 加上深藍色邊框
          }
        },
        // 邊的樣式
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#FF4136', // 紅色
            'target-arrow-color': '#FF4136',
            'target-arrow-shape': 'triangle', // 加上箭頭
            'curve-style': 'bezier' // 曲線樣式
          }
        }
      ],
      layout: {
        name: 'cose', // 自動佈局
        padding: 50,
        // nodeRepulsion: 4000, // 增加節點排斥力，讓節點間距更大
        // idealEdgeLength: 100, // 增大邊的理想長度
        // edgeElasticity: 0.1 // 增加邊的彈性，使網路更分散
      }
    });
