		<style>
			@font-face {
				font-family: "Cubic 11";
				src: url("/aso-pages/dagomachi/assets/Cubic_11-BYAGXrlw.woff2") format("woff2");
				font-display: block;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				overscroll-behavior: none;
				background-color: #14141c;
				background-size: cover;
				background-position: center;
				background-repeat: no-repeat;
			}
			#game {
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				/* 手機上長按 canvas 會跳出選取／放大鏡，直接關掉 */
				touch-action: none;
				-webkit-user-select: none;
				user-select: none;
			}
			#game canvas {
				display: block;
			}
			#rotate-prompt {
				display: none;
			}
			#title-screen {
				position: fixed;
				inset: 0;
				z-index: 700;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 24px;
				color: #fff;
				font-family: "Cubic 11", monospace;
			}
			/* 34.67vh ＝ 26vh × 4/3：讓 logo 在矮螢幕上由高度收斂，中央那欄才留得下
			   之後要加的圖鑑按鈕，也不會頂到釘在底部的「關於」。 */
			/* 全部可點的東西都給手指游標。桌機沒有這個提示就看不出哪裡能點，
			   手機沒差但也不會壞。LOGO 不在這裡面：連點它進的是隱藏入口，
			   給了手指游標就等於昭告有東西可點。 */
			button,
			.gallery-cell,
			#about-credits summary {
				cursor: pointer;
			}
			#title-logo {
				width: min(80vw, 400px, 34.67vh);
				aspect-ratio: 400 / 300;
				background-size: contain;
				background-repeat: no-repeat;
				background-position: center;
			}
			#start-button,
			#gallery-button,
			#gallery-close-button {
				font: inherit;
				font-size: 20px;
				padding: 10px 28px;
				color: #fff;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 4px;
			}
			/* 釘在底部、脫離中央那欄的 flow：留在 flow 裡的話 details 一展開就把
			   置中的 logo 與按鈕整組往上頂。展開的內容改成往上長。 */
			#about-credits {
				position: absolute;
				bottom: 16px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 10px;
				line-height: 1.4;
				color: rgba(255, 255, 255, 0.6);
				text-align: center;
				max-width: 90vw;
			}
			#about-credits a {
				color: inherit;
			}
			/* 靜音鈕。釘在畫面右下角，蓋過圖鑑的 750——它在每個畫面都要點得到。
			   兩態靠 .muted 切換 SVG 裡的兩個 group，不換圖檔。 */
			#mute-button,
			#help-button {
				position: fixed;
				right: 12px;
				bottom: 12px;
				z-index: 800;
				width: 44px;
				height: 44px;
				padding: 8px;
				box-sizing: border-box;
				color: rgba(255, 255, 255, 0.7);
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.4);
				border-radius: 4px;
			}
			#mute-button svg {
				display: block;
				width: 100%;
				height: 100%;
				fill: currentColor;
				stroke: currentColor;
				stroke-width: 1.8;
				stroke-linecap: round;
			}
			#mute-button .speaker-body {
				stroke: none;
			}
			#mute-button .waves,
			#mute-button .cross {
				fill: none;
			}
			#mute-button .cross,
			#mute-button.muted .waves {
				display: none;
			}
			#mute-button.muted .cross {
				display: inline;
			}
			/* 問號鈕跟靜音鈕同一組樣式，只差水平位置：12 + 44（靜音鈕寬）+ 12 = 68。 */
			#help-button {
				right: 68px;
				font: inherit;
				font-size: 24px;
				line-height: 1;
				padding: 0;
			}
			/* 教學彈窗。z-index 蓋過靜音／問號鈕的 800，不然 backdrop 點不到它們底下。 */
			#tutorial {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 850;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.75);
				color: #fff;
				font-family: "Cubic 11", monospace;
			}
			#tutorial.open {
				display: flex;
			}
			#tutorial-card {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				width: min(90vw, 560px);
				/* 固定高度而非 max-height：四頁圖片高矮不一，跟著內容伸縮的話翻頁時
				   卡片會上下抽動，方向鍵也跟著跑掉。 */
				height: max(60vh, 420px);
				/* 420px 的下限在很矮的視窗（橫向手機）會爆出畫面，所以再壓一層。 */
				max-height: 90vh;
				padding: 20px;
				box-sizing: border-box;
				background: #232334;
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 8px;
			}
			#tutorial-title {
				font-size: 22px;
			}
			#tutorial-desc {
				font-size: 14px;
				line-height: 1.5;
				text-align: center;
				opacity: 0.8;
			}
			#tutorial-image {
				flex: 1;
				min-height: 0;
				object-fit: contain;
				max-width: 100%;
			}
			#tutorial-nav {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 16px;
			}
			#tutorial-nav button {
				font: inherit;
				font-size: 20px;
				padding: 4px 16px;
				color: #fff;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 4px;
				cursor: pointer;
			}
			#tutorial-nav button:disabled {
				opacity: 0.3;
				cursor: default;
			}
			#tutorial-page {
				font-size: 14px;
				min-width: 3em;
				text-align: center;
			}
			#toast {
				position: fixed;
				z-index: 600;
				padding: 10px 14px;
				font-family: "Cubic 11", monospace;
				font-size: 22px;
				line-height: 22px;
				color: #fff;
				background: rgba(0, 0, 0, 0.4);
				border-radius: 4px;
				white-space: nowrap;
				pointer-events: none;
				opacity: 0;
				transition: opacity 0.1s;
				transform: translate(-50%, -100%);
			}
			#toast.visible {
				opacity: 1;
			}
			/* 圖鑑。Phase 12 只做直向單欄：九宮格＋下方單獨一格的隱藏結局。 */
			/* 開關走 class 不走 inline style：跟 #gallery-detail 同一個理由，
			   inline 的 display 會贏過 media query。 */
			#gallery-screen {
				display: none;
				position: fixed;
				inset: 0;
				/* 蓋過標題畫面的 700 */
				z-index: 750;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 16px;
				background: #14141c;
				color: #fff;
				font-family: "Cubic 11", monospace;
				padding: 10vh 0;
				box-sizing: border-box;
			}
			#gallery-screen.open {
				display: flex;
			}
			/* 3 欄 4 列的正方格，總高約等於寬的 4/3。上下各留 10vh、再扣掉返回鈕那一列，
			   剩不到 70vh，所以寬度上限抓 52vh 才不會把最下面那格頂出畫面。 */
			#gallery-cells {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 8px;
				width: min(90vw, 52vh);
			}
			/* 隱藏結局那格排在最後，自己佔一列的正中間。這裡選最後一個 div——
			   grid 的最後一個 item 是返回鈕（button），格子數量改了也不用動這條。 */
			#gallery-cells > .gallery-cell:last-of-type {
				grid-column: 2;
			}
			.gallery-cell {
				position: relative;
				aspect-ratio: 1;
				background-color: #2b2b3a;
				/* 手機沒有 hover，已解鎖的格子直接就是彩色態 */
				background-image: var(--active);
				background-size: cover;
				/* 格子寬度除不盡，cover 捨入後會差個零點幾 px，預設的 repeat 就拿同一張圖的
				   另一端補在上緣，看起來像露出別張圖的細縫。 */
				background-repeat: no-repeat;
				border: 1px solid rgba(255, 255, 255, 0.3);
			}
			.gallery-cell.selected {
				border-color: #fff;
				border-width: medium;
			}
			/* 返回鈕是格子 grid 的最後一個 item：窄螢幕自己跨滿一列、置中 */
			#gallery-close-button {
				grid-column: 1 / -1;
				justify-self: center;
			}
			/* 遮罩與卡片沿用離開確認彈窗的 .dialog / .dialog-box，這裡只蓋 z-index：
			   .dialog 的 650 會被圖鑑畫面的 750 蓋住。 */
			#gallery-detail {
				z-index: 760;
			}
			/* 開關走 class 不走 inline style：桌機那條 media query 要能把它改成常駐，
			   inline 的 display 會贏過 media query。 */
			#gallery-detail.open {
				display: flex;
			}
			.gallery-lock {
				position: absolute;
				right: 4%;
				bottom: 4%;
				width: 15%;
				/* 鎖頭圖是深色的，壓在剪影上要反白才看得見 */
				filter: invert(1);
			}
			.dialog {
				display: none;
				position: fixed;
				inset: 0;
				z-index: 650;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.5);
				font-family: "Cubic 11", monospace;
			}
			.dialog-box {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 16px;
				padding: 20px 28px;
				color: #fff;
				background: #14141c;
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 4px;
			}
			#leave-confirm-buttons {
				display: flex;
				gap: 12px;
			}
			.dialog-box button {
				font: inherit;
				font-size: 16px;
				padding: 8px 20px;
				color: #fff;
				background: rgba(0, 0, 0, 0.4);
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 4px;
			}
			/* 96×96 的點陣圖，整數倍放大才不糊 */
			#c38b-image {
				width: 192px;
				height: 192px;
				image-rendering: pixelated;
			}
			/* 寬度釘死：跟著內文長短伸縮的話，換一格結局整個面板就會抽動一次 */
			/* 窄螢幕左右各留 10px 就好，左右內距讓給內容 */
			#gallery-detail-box {
				box-sizing: border-box;
				position: relative;
				width: calc(100vw - 20px);
				padding-left: 0;
				padding-right: 0;
				/* 跟裡面的 .result-panel 同色，才看不出是兩層盒子 */
				background: #232334;
			}
			/* 彈窗模式的關閉鈕。太窄時卡片幾乎貼滿畫面，點得到的 backdrop 只剩左右各 10px。 */
			#gallery-detail-close {
				position: absolute;
				top: 2px;
				right: 8px;
				padding: 4px 8px;
				font-size: 22px;
				line-height: 1;
				background: none;
				border: 0;
			}
			/* 還沒點任何格時，桌機的右欄不該留一個空框。用 visibility 而不是 display，
			   位子要先佔著，不然點第一下格子時整排格子會往左跳。 */
			#gallery-detail:not(.open) #gallery-detail-box {
				visibility: hidden;
			}
			/* 兩條 query 管兩件不同的事，不要合併：
			   版面分欄看寬度（窄螢幕塞不下兩欄，跟裝置是不是觸控無關），
			   黑白／彩色兩態看 hover 能力（點不出 hover 的裝置給它彩色態就好）。 */
			@media (min-width: 768px) {
				#gallery-screen {
					flex-direction: row;
					gap: 32px;
				}
				#gallery-cells {
					width: min(42vw, 62vh);
				}
				/* 詳情常駐在右邊，不再是蓋住畫面的彈窗 */
				#gallery-detail {
					display: flex;
					position: static;
					background: none;
				}
				/* 桌機的詳情是常駐右欄，沒有「關閉」可言 */
				#gallery-detail-close {
					display: none;
				}
				#gallery-detail-box {
					width: min(42vw, 62vh);
					padding-left: 28px;
					padding-right: 28px;
				}
				/* 返回鈕住在格子那張 grid 裡，桌機時佔最後一列的第一欄——
				   也就是隱藏結局那格（4 / 2）左邊那個空位。那一列跟格子一樣高，
				   按鈕矮得多，靠下對齊才會跟整片格子的下緣切齊。 */
				#gallery-close-button {
					grid-row: 4;
					grid-column: 1;
					justify-self: stretch;
					align-self: end;
				}
				/* 兩態只在桌機版面出現：窄螢幕沒有滑鼠可以移上去，全彩比較好認。
				   判準用寬度而不是 hover 能力——觸控筆電照樣是兩欄版面。 */
				.gallery-cell {
					background-image: var(--base);
				}
				.gallery-cell.selected {
					background-image: var(--active);
				}
			}
			/* hover 效果本身仍要問 hover 能力：觸控裝置上 :hover 會在點過之後黏著不放。 */
			@media (min-width: 768px) and (hover: hover) {
				.gallery-cell:hover {
					background-image: var(--active);
				}
			}
			/* 「請轉直向」沒有可靠的判準可用：orientation 比的是 viewport 寬高、不是裝置方向
			   （軟鍵盤彈出就能把直向變成橫向），pointer: coarse 在 DevTools 一開裝置工具列
			   就恆真。所以只能疊啟發式，三條各擋一種誤判：
			     max-height: 500px  平板橫向（iPad 橫向 768 高）與 DevTools 的大尺寸模擬
			     max-width: 950px   桌機開著 DevTools 時的扁條視窗——量到的實例是 1007 × 492，
			                        高度過得了關但寬度過不了（手機橫拿最寬的 iPhone 16 Pro Max
			                        也只有 932）
			     pointer: coarse    真桌機把視窗壓扁的情況
			   原理上分不開「900 × 450 的桌機視窗」與「真手機橫拿」——那是同一個 viewport。
			   所以開發時真正的逃生口是 mountRotatePromptDismiss()：點一下就收起（僅開發版）。
			   註：W3C 把「只顯示訊息叫使用者轉方向」列為 WCAG 1.3.4 的失敗案例 F100，例外是
			   該方向為活動本質所需。這台是直向的實體機殼造型，走的是那個例外。 */
			@media (orientation: landscape) and (max-height: 500px) and (max-width: 950px) and (pointer: coarse) {
				#rotate-prompt:not(.dismissed) {
					display: flex;
					position: fixed;
					inset: 0;
					z-index: 1000;
					align-items: center;
					justify-content: center;
					background: #14141c;
					color: #fff;
					font-size: 1.25rem;
				}
			}
		</style>

			<button id="start-button" type="button">開始遊戲</button>
